<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/chat.css" />
  <script src="/app-config.js"></script>
  <title>Messages</title>
</head>
<body class="chat" data-title="Messages">
  <aside class="side">
    <div class="side-head">
      <span class="brand">bark<i>.</i></span>
      <span class="side-sub">Messages</span>
    </div>
    <nav class="convs" aria-label="Conversations">
      <h2>Channels</h2>
      <ul id="channel-list"></ul>
      <h2>Direct messages</h2>
      <ul id="dm-list"></ul>
    </nav>
    <div class="me" id="me">
      <span class="avatar" id="me-avatar"></span>
      <span class="me-name" id="me-name">Connecting…</span>
    </div>
  </aside>

  <main class="room">
    <header class="room-head">
      <div class="room-title">
        <span id="room-icon" class="room-icon"></span>
        <h1 id="room-name"></h1>
        <span id="room-status" class="room-status"></span>
      </div>
      <div class="room-actions">
        <button id="join-call" class="pill" type="button" hidden></button>
        <button id="start-voice" class="icon-btn" type="button" title="Start voice call" aria-label="Start voice call">
          <svg class="icon" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        </button>
        <button id="start-video" class="icon-btn" type="button" title="Start video call" aria-label="Start video call">
          <svg class="icon" viewBox="0 0 24 24"><path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
      </div>
    </header>

    <section id="call" class="call" hidden>
      <div id="tiles" class="tiles"></div>
      <div class="call-bar">
        <span id="call-label" class="call-label"></span>
        <button id="toggle-mic" class="round" type="button" title="Mute" aria-label="Mute">
          <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg>
        </button>
        <button id="toggle-cam" class="round" type="button" title="Turn camera on" aria-label="Camera">
          <svg class="icon" viewBox="0 0 24 24"><path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
        <button id="leave-call" class="round danger" type="button" title="Leave call" aria-label="Leave call">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9M23 1 1 23"/></svg>
        </button>
      </div>
    </section>

    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="typing" class="typing"></div>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button class="send" type="submit" aria-label="Send">
        <svg class="icon" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </main>

  <div id="ring" class="ring" hidden>
    <span class="avatar" id="ring-avatar"></span>
    <div class="ring-text"><strong id="ring-name"></strong><span id="ring-kind"></span></div>
    <button id="ring-join" class="pill accept" type="button">Join</button>
    <button id="ring-decline" class="pill" type="button">Decline</button>
  </div>

  <div id="banner" class="banner" hidden></div>

  <script src="/assets/js/chat.js"></script>
</body>
</html>
