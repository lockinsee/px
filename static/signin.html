<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Sign in · bark</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(900px 600px at 70% -10%, #1a1a20 0%, transparent 60%), #08080a;
      color: #f4f4f6;
      font-family: "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(400px, 100%);
      padding: 40px 32px 32px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
      text-align: center;
    }
    .brand { font-weight: 800; font-size: 40px; letter-spacing: -0.045em; margin: 0 0 6px; }
    .brand i { font-style: normal; color: #6b6b74; }
    p { margin: 0 0 28px; color: #a9a9b2; line-height: 1.5; }
    .google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 52px;
      border-radius: 999px;
      background: #fff;
      color: #1f1f1f;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 10px 30px -12px rgba(255, 255, 255, 0.35);
    }
    .google:hover { transform: translateY(-1px); box-shadow: 0 16px 40px -14px rgba(255, 255, 255, 0.45); }
    .google svg { width: 20px; height: 20px; }
    small { display: block; margin-top: 20px; color: #6b6b74; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">bark<i>.</i></h1>
    <p>Sign in to use Messages, calls and the Browser.</p>
    <a class="google" id="google" href="/auth/google/start">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </a>
    <small>Any Google account works. bark never sees your password.</small>
  </main>
  <script>
    // Come back to the page you were trying to open.
    const back = new URLSearchParams(location.search).get("return");
    if (back) document.getElementById("google").href = `/auth/google/start?return=${encodeURIComponent(back)}`;
  </script>
</body>
</html>
